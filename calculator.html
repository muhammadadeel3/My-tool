<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیلکولیٹر - میرا ٹولز ہب</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: #0f172a;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 350px;
        }

        .display {
            background: #1e293b;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            direction: ltr;
        }

        .history {
            font-size: 16px;
            color: #94a3b8;
            min-height: 20px;
            word-wrap: break-word;
        }

        .current {
            font-size: 38px;
            font-weight: 600;
            word-wrap: break-word;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            background: #334155;
            color: white;
            border: none;
            padding: 20px 0;
            font-size: 22px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .btn:hover {
            background: #475569;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.operator {
            background: #2563eb;
        }

        .btn.operator:hover {
            background: #1d4ed8;
        }

        .btn.equal {
            background: #16a34a;
            grid-column: span 2;
        }

        .btn.equal:hover {
            background: #15803d;
        }

        .btn.clear {
            background: #dc2626;
        }

        .btn.clear:hover {
            background: #b91c1c;
        }

        .btn.zero {
            grid-column: span 2;
        }

        .back-btn {
            display: block;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
            margin-top: 20px;
            font-size: 14px;
        }

        .back-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <div class="calculator">
            <div class="display">
                <div class="history" id="history"></div>
                <div class="current" id="current">0</div>
            </div>

            <div class="buttons">
                <button class="btn clear" onclick="clearAll()">C</button>
                <button class="btn operator" onclick="deleteLast()">⌫</button>
                <button class="btn operator" onclick="appendOperator('%')">%</button>
                <button class="btn operator" onclick="appendOperator('/')">÷</button>

                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn operator" onclick="appendOperator('*')">×</button>

                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn operator" onclick="appendOperator('-')">−</button>

                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn operator" onclick="appendOperator('+')">+</button>

                <button class="btn zero" onclick="appendNumber('0')">0</button>
                <button class="btn" onclick="appendNumber('.')">.</button>
                <button class="btn equal" onclick="calculate()">=</button>
            </div>
        </div>

        <a href="index.html" class="back-btn">→ واپس ہوم پیج پر جائیں</a>
    </div>

    <script>
        let currentInput = '0';
        let historyInput = '';

        function updateDisplay() {
            document.getElementById('current').innerText = currentInput;
            document.getElementById('history').innerText = historyInput;
        }

        function appendNumber(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else if (num === '.' && currentInput.includes('.')) {
                return;
            } else {
                currentInput += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '' && op !== '-') return;
            const lastChar = currentInput.slice(-1);
            if (['+', '-', '*', '/', '%'].includes(lastChar)) {
                currentInput = currentInput.slice(0, -1) + op;
            } else {
                currentInput += op;
            }
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            historyInput = '';
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length === 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            try {
                let expression = currentInput.replace(/%/g, '/100');
                let result = eval(expression);
                if (!isFinite(result)) {
                    historyInput = currentInput + ' =';
                    currentInput = 'خرابی';
                } else {
                    historyInput = currentInput + ' =';
                    currentInput = String(Math.round(result * 100000000) / 100000000);
                }
                updateDisplay();
            } catch (e) {
                currentInput = 'خرابی';
                updateDisplay();
            }
        }
    </script>
</body>
</html>
