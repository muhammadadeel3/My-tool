<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کیلکولیٹر - میرا ٹولز ہب</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .calc-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .calc-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .calc-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }
        .calc-container button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .calc-container button:hover {
            background: #2980b9;
        }
        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            min-height: 50px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>بنیادی کیلکولیٹر</h1>
    </header>

    <div class="calc-container">
        <h2>حساب کتاب کریں</h2>
        <input type="number" id="num1" placeholder="پہلا نمبر لکھیں">
        <input type="number" id="num2" placeholder="دوسرا نمبر لکھیں">
        <button onclick="add()">➕ جمع کریں</button>
        <button onclick="subtract()">➖ تفریق کریں</button>
        <button onclick="multiply()">✖️ ضرب کریں</button>
        <button onclick="divide()">➗ تقسیم کریں</button>
        <p id="result">نتیجہ یہاں آئے گا</p>
        <a href="index.html" class="back-link">→ واپس ہوم پیج پر جائیں</a>
    </div>

    <script>
        function getNumbers() {
            let n1 = parseFloat(document.getElementById('num1').value);
            let n2 = parseFloat(document.getElementById('num2').value);
            if (isNaN(n1) || isNaN(n2)) {
                document.getElementById('result').innerText = "⚠️ براہ کرم دونوں نمبر لکھیں";
                return null;
            }
            return [n1, n2];
        }

        function showResult(value) {
            document.getElementById('result').innerText = "نتیجہ: " + value;
        }

        function add() {
            let nums = getNumbers();
            if (nums) showResult(nums[0] + nums[1]);
        }

        function subtract() {
            let nums = getNumbers();
            if (nums) showResult(nums[0] - nums[1]);
        }

        function multiply() {
            let nums = getNumbers();
            if (nums) showResult(nums[0] * nums[1]);
        }

        function divide() {
            let nums = getNumbers();
            if (nums) {
                if (nums[1] === 0) {
                    document.getElementById('result').innerText = "⚠️ صفر سے تقسیم نہیں ہو سکتی";
                } else {
                    showResult(nums[0] / nums[1]);
                }
            }
        }
    </script>
</body>
</html>
